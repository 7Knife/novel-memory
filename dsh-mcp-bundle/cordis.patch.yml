- insert:
    - id: novel-memory-basic-memory-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: basicmemory
        transport: stdio
        command: uvx
        args:
          - '--prerelease=allow'
          - basic-memory
          - mcp
        failOnStartupError: false

